name: Site and PHP checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, openssl, sodium, curl, gd, fileinfo
          ini-values: memory_limit=256M
          coverage: none
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:reg
      - run: npm run build:reg:test
      - run: npm run test:catalog
      - run: node --test tests/registration-production.test-reg.mjs
      - run: npm run build:reg:test:ucaller
      - run: node --test tests/ucaller-http.test-reg.mjs
      - run: npm run build:reg:delivery
      - run: npm run test:reg
      - run: npm run build:reg:test:delivery
      - run: npm run test:staging
